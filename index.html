<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зургаа давхаргаар бүтээ</title>
<style>
:root {
  font: 500 100%/1.5 Inter, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  --night: #1b1145;
  --twilight: #2d1b69;
  --violet: #4c1d95;
  --primary: #8b5cf6;
  --primary-light: #a78bfa;
  --pink: #ec4899;
  --cyan: #22d3ee;
  --gold: #facc15;
  --success: #22c55e;
  --danger: #ef4444;
  --paper: #fff;
  --ink: #1e1b4b;
  --muted: #6b7280;
  --panel: #1f1b3a;
  --line: #ddd8ed;
  --radius: 24px;
  color: var(--ink);
  background: var(--night);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; background: linear-gradient(145deg, var(--night), var(--twilight) 52%, var(--violet)); }
body::before, body::after {
  position: fixed; inset: -18px; pointer-events: none; content: "";
  background: radial-gradient(circle at 8% 14%, #d7bbff 0 2px, transparent 3px),
    radial-gradient(circle at 92% 28%, var(--cyan) 0 2px, transparent 3px),
    radial-gradient(circle at 16% 65%, var(--pink) 0 2px, transparent 4px),
    radial-gradient(circle at 88% 79%, var(--gold) 0 2px, transparent 4px);
  animation: drift 10s ease-in-out infinite alternate;
}
body::after { transform: scaleX(-1); opacity: .55; animation-delay: -5s; }
@keyframes drift { to { translate: 0 14px; } }
main { position: relative; z-index: 1; width: min(1100px, calc(100% - 28px)); margin: max(16px, env(safe-area-inset-top)) auto max(24px, env(safe-area-inset-bottom)); }
h1, h2, p { margin: 0; }
button, input { font: inherit; }
button {
  min-height: 46px; padding: 8px 14px; border: 1px solid #cbc0e5; border-radius: 14px;
  background: #f1ebff; color: var(--ink); font-weight: 750; cursor: pointer;
  transition: background .18s, border-color .18s, box-shadow .18s, transform .18s;
}
button:enabled:hover { background: #e7dbff; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid #7136d0; outline-offset: 3px; }
header {
  position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1fr) auto;
  align-items: center; gap: 12px; overflow: hidden; padding: clamp(16px, 4vw, 32px);
  border: 1px solid #ffffff4d; border-radius: var(--radius);
  background: linear-gradient(120deg, #6532c9, #ad207e 55%, #145aa3);
  color: #fff; box-shadow: 0 14px 30px #1008287a;
}
header p { margin-bottom: 7px; color: #fff; font-size: .76rem; font-weight: 800; letter-spacing: .075em; }
h1 { font-size: clamp(28px, 5vw, 48px); line-height: 1.08; font-weight: 800; letter-spacing: -.035em; text-shadow: 0 3px 12px #1b11456e; text-wrap: balance; }
.header-art { position: relative; width: clamp(64px, 13vw, 125px); aspect-ratio: 1.16; margin-right: 44px; animation: drift 3s ease-in-out infinite alternate; }
.header-art span { position: absolute; inset: 17%; border: 2px solid #ffffffae; border-radius: 17%; box-shadow: 0 7px 14px #150b4170; transform: translateY(var(--y)) rotate(45deg) skew(-9deg, -9deg) scaleY(.62); background: var(--fill); }
.header-art span:nth-child(1) { --y: 30%; --fill: var(--primary-light); }
.header-art span:nth-child(2) { --y: 0%; --fill: var(--pink); }
.header-art span:nth-child(3) { --y: -30%; --fill: var(--cyan); }
#sound, #tilt {
  display: grid; place-items: center; width: 44px; height: 44px; min-height: 44px; padding: 0;
  border: 1px solid #ffffff82; border-radius: 50%; background: #211346e8; color: white; font-size: 0;
}
#sound { position: absolute; z-index: 1; top: 9px; right: 9px; }
#sound::before, #tilt::before { font-size: 1.15rem; }
#sound::before { content: "🔊"; }
#sound[aria-pressed="false"]::before { content: "🔇"; }
#sound:hover, #tilt:hover { background: #352065; }
.card { margin-top: 16px; padding: clamp(15px, 3vw, 30px); border-radius: var(--radius); background: var(--paper); box-shadow: 0 18px 40px #0e092c80; }
.status, .actions, .stats { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.status { justify-content: space-between; font-size: .88rem; font-weight: 800; }
.stats { font-variant-numeric: tabular-nums; }
.stats span { padding: 6px 11px; border-radius: 100px; color: #3b2500; font-weight: 800; }
#xp { background: var(--gold); }
#streak { background: #ffab58; }
.pop { animation: pop .32s ease-out; }
@keyframes pop { 48% { transform: scale(1.14); } }
.progress-track { position: relative; overflow: hidden; border-radius: 100px; margin-top: 12px; }
progress { display: block; appearance: none; width: 100%; height: 14px; border: 0; border-radius: 100px; background: #ebe6f5; accent-color: var(--primary); }
progress::-webkit-progress-bar { background: #ebe6f5; }
progress::-webkit-progress-value { border-radius: 100px; background: linear-gradient(90deg, var(--primary), var(--pink)); }
progress::-moz-progress-bar { border-radius: 100px; background: linear-gradient(90deg, var(--primary), var(--pink)); }
.progress-track::after { position: absolute; inset: 0; width: var(--fill, 25%); border-radius: inherit; pointer-events: none; background: linear-gradient(110deg, transparent 35%, #ffffff75 50%, transparent 65%) 110% / 240% 100%; content: ""; animation: shine 2.6s ease-in-out infinite; }
@keyframes shine { to { background-position: -100%; } }
.steps { display: flex; gap: 8px; margin: 10px 0 18px; padding: 0; list-style: none; }
.steps li { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 50%; background: #e8e7ee; color: #49435c; font-size: .79rem; font-weight: 800; }
.steps .done { background: var(--success); color: #0c341d; }
.steps .current { background: var(--pink); color: #321128; animation: ring 1.65s ease-out infinite; }
@keyframes ring { 70%, 100% { box-shadow: 0 0 0 6px #ec489900; } 0% { box-shadow: 0 0 0 0 #ec489955; } }
.studio { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(235px, 1fr); gap: 20px; }
.scene {
  position: relative; isolation: isolate; overflow: hidden; border: 5px solid #f2f1f7; border-radius: 20px;
  background: conic-gradient(#e9e7f0 25%, #f9f8fd 0 50%, #e9e7f0 0 75%, #f9f8fd 0) 0 0 / 24px 24px;
  box-shadow: 0 0 0 1px #ccc6de, 0 8px 20px #20134e38;
}
#artwork { display: block; width: 100%; height: auto; }
.scene:has(#empty:not([hidden])) #artwork > rect { opacity: 0; }
.scene p { position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: max-content; max-width: 92%; padding: 8px 12px; border: 1px solid #dad3eb; border-radius: 12px; background: #fff; text-align: center; font-weight: 750; pointer-events: none; }
.scene p::before { content: "↳ "; color: #6230b5; }
.scene.reward { animation: flash .68s ease-out; }
.scene.reward::after { position: absolute; inset: 8% 7%; pointer-events: none; color: var(--gold); content: "✦　　✧　　　✦"; text-align: center; font-size: clamp(22px, 5vw, 45px); text-shadow: 0 1px 6px #322147; animation: sparkle .65s ease-out both; }
@keyframes flash { 30% { box-shadow: 0 0 0 4px var(--success), 0 0 22px #22c55e85; } }
@keyframes sparkle { from { opacity: 0; transform: scale(.45) translateY(18px); } 35% { opacity: 1; } to { opacity: 0; transform: scale(1.15) translateY(-12px); } }
.panel { min-width: 0; padding: 14px; border-radius: 18px; background: var(--panel); color: #fff; }
.panel h2 { font-size: 1.06rem; font-weight: 800; }
.panel p { margin-top: 3px; font-size: .83rem; color: #ccc6e5; }
.rows { display: grid; gap: 6px; margin: 9px 0 0; padding: 0; list-style: none; }
.rows:empty::before { display: block; padding: 12px 6px; border: 1px dashed #7c719e; border-radius: 10px; color: #ccc6e5; text-align: center; content: "▧  Давхарга алга"; font-size: .85rem; }
.row { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 2px 5px; border: 1px solid #5a507d; border-radius: 10px; background: #30284e; font-size: .92rem; font-weight: 750; transition: transform .18s, box-shadow .18s, border-color .18s; }
.row.selected, .row:focus-within { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); }
.row.drop { box-shadow: inset 0 3px var(--cyan), 0 0 12px #22d3ee55; }
.row.moving { transform: translateY(-3px); box-shadow: 0 8px 16px #080415a0; border-color: var(--cyan); background: #423466; }
.row.off .thumb { opacity: .48; }
.row.off .name { color: #ccc6e5; }
.row.fresh { animation: row-in .25s ease-out both; }
@keyframes row-in { from { opacity: 0; transform: translateY(-8px); } }
.thumb { flex: none; width: 40px; height: 29px; border-radius: 6px; background: #ded6f4; }
.eye, .handle { min-width: 44px; min-height: 44px; padding: 4px; border-color: #776c9a; color: #fff; background: #433661; }
.eye:enabled:hover, .handle:enabled:hover { background: #5d4883; }
.eye:disabled { color: #c8bedc; background: #30284e; }
.eye svg { width: 20px; height: 20px; vertical-align: middle; }
.handle { margin-inline-start: auto; touch-action: none; user-select: none; cursor: grab; }
.handle:active { cursor: grabbing; }
.order-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.order-buttons button { flex: 1; font-size: .83rem; }
.order-buttons button:disabled { background: #393050; border-color: #675e84; color: #ccc6e5; }
.task { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
.task h2 { font-size: clamp(26px, 4vw, 32px); line-height: 1.15; font-weight: 800; letter-spacing: -.025em; text-wrap: balance; }
.task p { margin-top: 5px; }
#task-intro { margin: 0 0 18px; padding: 0; border: 0; }
#instruction { color: var(--muted); font-size: 16px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
.choices button { display: flex; gap: 10px; align-items: center; min-height: 64px; border: 1px solid #c5b5e5; border-bottom: 4px solid #ac94d7; background: #fff; color: var(--ink); text-align: left; font-size: 18px; font-weight: 600; line-height: 1.3; }
.choices button:hover:enabled { transform: translateY(-3px); border-color: var(--primary); background: #faf7ff; box-shadow: 0 6px 15px #43247c26; }
.choices button:active:enabled { transform: translateY(2px); box-shadow: none; }
.badge { display: grid; place-items: center; flex: 0 0 35px; height: 35px; border-radius: 50%; background: var(--primary-light); color: #201041; font-weight: 800; }
.choices button:nth-child(2) .badge { background: #f88ac0; color: #39102a; }
.choices button:nth-child(3) .badge { background: var(--cyan); }
.choices button:nth-child(4) .badge { background: var(--gold); }
.choices .wrong { background: #ffe5e7; border-color: #c63340; color: #811f2b; animation: shake .3s ease-in-out; }
.choices .right { background: #dcfae8; border-color: #16824a; color: #15583a; }
.choices .wrong::after, .choices .right::after { margin-inline-start: auto; font-weight: 900; }
.choices .wrong::after { content: "✗"; }
.choices .right::after { content: "✓"; }
.range { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; align-items: center; margin-top: 12px; padding: 10px 13px; border: 1px solid #cdb9f0; border-radius: 15px; background: #f1eaff; }
.range label { grid-column: 1 / -1; font-weight: 750; }
.range input { width: 100%; min-height: 44px; margin: 0; accent-color: #6734c2; }
.range output { min-width: 5ch; font-weight: 800; font-variant-numeric: tabular-nums; }
.coach { display: flex; align-items: center; gap: 12px; max-width: 620px; margin: 12px 0 0 auto; }
.coach svg { order: 1; flex: none; width: clamp(82px, 13vw, 100px); height: auto; filter: drop-shadow(0 4px 3px #28194d3b); }
.coach div { position: relative; min-width: 0; padding: 11px 13px; border: 1px solid #d2c0ef; border-radius: 16px; background: #f5eeff; }
.coach div::after { position: absolute; top: 48%; right: -7px; width: 12px; height: 12px; transform: rotate(45deg); border-top: 1px solid #d2c0ef; border-right: 1px solid #d2c0ef; background: inherit; content: ""; }
.coach strong { color: #5c279e; font-size: .91rem; }
.coach p { margin: 1px 0 0; color: var(--ink); font-size: .94rem; }
.face { display: none; }
.face-idle { display: block; }
.face-idle circle { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
#task.shake .face-idle, #task.glow .face-idle { display: none; }
#task.shake .face-sad, #task.glow .face-happy { display: block; }
#task.glow .face-sad { display: none; }
@keyframes blink { 46%, 52% { transform: scaleY(1); } 49% { transform: scaleY(.15); } }
.why { padding: 10px 13px; border: 1px solid #9ad7b4; border-radius: 12px; background: #e1f8ea; color: #174a31; }
.actions { justify-content: flex-end; margin-top: 13px; }
.primary { background: linear-gradient(110deg, #36db82, var(--cyan)); border: 1px solid #4bbbae; border-bottom: 4px solid #198270; color: #10372e; }
.primary:hover:enabled { background: linear-gradient(110deg, #55ec94, #53dff3); }
.primary:disabled { background: #e4e3eb; border-color: #c9c5d6; color: #575166; }
#next:enabled { animation: ready 1.6s ease-out 3; }
@keyframes ready { 45% { box-shadow: 0 0 0 6px #22c55e30; } }
.result { text-align: center; }
.result .actions { justify-content: center; }
#stars { display: inline-block; padding: 3px 12px; border-radius: 40px; background: #fff1ac; color: #563c00; font-size: 1.65rem; }
#tilt { position: absolute; z-index: 1; top: 5px; right: 5px; display: none; }
#tilt::before { content: "📱"; }
#tilt:disabled { opacity: .6; }
.stage-enter { transform-box: fill-box; transform-origin: center; animation: bounce-in .55s cubic-bezier(.2,.65,.35,1) both; }
.task-enter { animation: slide .28s ease-out both; }
.shake { animation: shake .32s ease-in-out; }
.jump { animation: jump .43s ease-out; }
.glow #mascot { animation: jump .43s ease-out; }
@keyframes bounce-in { 0% { opacity: 0; transform: translateY(-25px); } 65% { opacity: 1; transform: translateY(5px); } 82% { transform: translateY(-2px); } }
@keyframes slide { from { opacity: 0; transform: translateX(-15px); } }
@keyframes shake { 25%, 75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
@keyframes jump { 45% { transform: translateY(-12px) rotate(-8deg); } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
@media (min-width: 701px) { main { margin-block: 35px; } }
@media (max-width: 700px) {
  main { width: calc(100% - 20px); }
  .header-art { margin-right: 26px; }
  .studio, .choices { grid-template-columns: 1fr; }
  .studio { gap: 14px; }
  #artwork { max-height: 34svh; }
  .actions > button { flex: 1; min-height: 50px; }
  #tilt { display: grid; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .choices button:enabled:hover, .choices button:enabled:active, .row.moving { transform: none; }
  .scene.reward::after, .progress-track::after { display: none; }
}

</style></head><body>
<main>
<header><div><p>7-Р АНГИ · МЭДЭЭЛЭЛ ЗҮЙ</p><h1>Зургаа давхаргаар бүтээ</h1></div><div class="header-art" aria-hidden="true"><span></span><span></span><span></span></div><button id="sound" type="button" aria-label="Дуу" title="Дуу" aria-pressed="true">🔊 Дуу</button></header>
<section class="card" aria-label="Зургийн давхаргын тоглоом">
<div class="status"><span id="progress-label" aria-live="polite"></span><div class="stats"><span id="xp"></span><span id="streak"></span></div></div>
<div class="progress-track"><progress id="progress" aria-label="Даалгаврын явц"></progress></div>
<ol id="steps" class="steps" aria-hidden="true"></ol>
<div id="task-intro" class="task">
  <h2 id="title" tabindex="-1"></h2>
  <p id="instruction"></p>
</div>
<div class="studio">
<div class="preview">
<div class="scene" id="scene"><svg id="artwork" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 355" role="img" aria-label="Давхаргаар бүтээж буй зураг"><defs>
<linearGradient id="sky-gradient" x2="0" y2="1"><stop stop-color="#9a78d2"/><stop offset=".6" stop-color="#f2abd7"/><stop offset="1" stop-color="#ffd4b7"/></linearGradient>
<linearGradient id="sun-gradient" x2="0" y2="1"><stop stop-color="#fff6ae"/><stop offset="1" stop-color="#ffae91"/></linearGradient>
</defs><rect width="640" height="355" fill="#f5eafb"/><g id="art-layers"></g></svg><p id="empty">Давхаргууд энд нэмэгдэнэ</p><button id="tilt" type="button" aria-label="Утасны хөдөлгөөнөөр удирдах" title="Утасны хөдөлгөөнөөр удирдах" hidden>Утасны хөдөлгөөнөөр удирдах</button></div>
<div id="range" class="range" hidden><label for="opacity">Сүнсний харагдах хэмжээ</label><input id="opacity" type="range" min="0" max="100" value="100" aria-describedby="opacity-value"><output id="opacity-value" for="opacity">100%</output></div>
</div>
<aside class="panel"><h2>Давхаргууд</h2><p>Дээд мөрийн давхарга зураг дээр урд харагдана.</p><ol id="rows" class="rows"></ol><div id="order-buttons" class="order-buttons" hidden><button id="up" type="button">Нарыг дээш ↑</button><button id="down" type="button">Нарыг доош ↓</button></div></aside>
</div>
<section id="task" class="task" aria-labelledby="title"><div id="choices" class="choices" hidden></div>
<div class="coach">
  <svg id="mascot" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M6 42 32 55 58 42 32 29Z" fill="#8b5cf6"/>
    <path d="M6 33 32 46 58 33 32 20Z" fill="#ec4899"/>
    <path d="M6 23 32 10 58 23 32 37Z" fill="#22d3ee"/>
    <g class="face face-idle" fill="#1e1b4b"><circle cx="25" cy="23" r="2"/><circle cx="39" cy="23" r="2"/><path d="M28 27q4 5 8 0" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/></g>
    <g class="face face-happy"><path id="eye-star" d="m25 17 1.6 3.5 3.8.5-2.7 2.6.6 3.8-3.3-1.8-3.3 1.8.6-3.8-2.7-2.6 3.8-.5Z" fill="#facc15" stroke="#664200" stroke-width=".9"/><use href="#eye-star" x="14"/><path d="M28 28h8q-4 8-8 0Z" fill="#1e1b4b"/></g>
    <g class="face face-sad" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"><path d="m22 24 5-3m10 0 5 3m-13 6q3-4 6 0"/></g>
  </svg>
  <div><strong>Давхар</strong><p id="hint" role="status"></p></div>
</div>
<div aria-live="polite"><p id="why" class="why" hidden></p></div><div class="actions"><button id="check" type="button" hidden>Шалгах</button><button id="next" class="primary" type="button" disabled>Дараах даалгавар →</button></div></section>
<section id="result" class="task result" hidden><p id="stars" role="img"></p><h2 id="award" tabindex="-1"></h2><p id="summary"></p><p id="save-status" role="status"></p><div class="actions"><button id="save" class="primary" type="button">Зургаа хадгал</button><button id="restart" type="button">Дахин эхлэх</button></div></section>
</section></main><canvas id="confetti" aria-hidden="true" hidden></canvas>
<script>
  // Даалгаврын өгөгдөл, шалгах нөхцөл болон нээгдэх давхарга.
  const tasks = [
    {
      type: "choice", title: "Давхарга гэж юу вэ?", instruction: "Нэг зөв хариулт сонгоорой.",
      choices: ["Зургийг устгах хэрэгсэл", "Зургийн хэсгүүдийг давхарлан байрлуулах арга", "Зургийн өнгө солих арга", "Зургийг хэвлэх тохиргоо"],
      correct: 1, reward: "sky", hint: "Тунгалаг хуудсуудыг дээр дээр нь тавьж байна гэж төсөөлөөрэй.",
      why: "Давхарга бүрд зургийн өөр хэсгийг байрлуулдаг. Ингэснээр хэсэг бүрийг тусад нь засварлаж болно."
    },
    {
      type: "order", title: "Нарыг уулын ард байрлуул", reward: "mountain",
      instruction: "Нарны мөрийн бариулыг чир. Эсвэл сумтай товчоор нарыг шилжүүлээд шалгаарай.",
      expected: ["sky", "sun", "mountain", "hero"],
      hint: "Нарны мөрийг уулын мөрийн доор байрлуулаарай.",
      why: "Уул нь нарнаас дээгүүр давхаргад байвал давхцсан хэсэгт уул нарыг халхална. Тэнгэр хамгийн ард үлдэнэ."
    },
    {
      type: "eye", title: "Үүлийг нуу", target: "cloud", reward: "sun",
      instruction: "Үүлний мөрийн нүдний дүрсийг дараарай.",
      hint: "Нүдийг дарахад тухайн давхаргын харагдац солигдоно.",
      why: "Нүдийг унтраахад давхарга түр далд болно. Буцааж асаахад үүл дахин харагдана."
    },
    {
      type: "opacity", title: "Сүнсийг 50% тунгалаг болго", min: 45, max: 55, reward: "hero",
      instruction: "Гулсуурын заалтыг 45–55% дотор оруулаад «Шалгах» товчийг дараарай.",
      hint: "50% орчимд сүнсний цаадах уулын дүрс нэвт харагдана.",
      why: "50% орчимд сүнсний өнгө болон арын зураг хоёулаа харагдана. Тохиргоо тухайн давхаргын бүх агуулгад үйлчилнэ."
    }
  ];

  // Ижил SVG дүрсийг тайз, жижиг зураг болон PNG файлд ашиглана.
  const art = {
    sky: { name: "Тэнгэр", depth: 0, view: "0 0 640 355", shape: '<rect width="640" height="355" fill="url(#sky-gradient)"/><path d="M70 75h6m-3-3v6M560 47h8m-4-4v8M185 54h5m-2.5-2.5v5M487 68h6m-3-3v6" stroke="#fff4ff" stroke-width="2" stroke-linecap="round"/>' },
    sun: { name: "Нар", depth: 2, view: "300 74 153 153", shape: '<circle cx="376" cy="151" r="72" fill="#ffe2ad" opacity=".32"/><circle cx="376" cy="151" r="57" fill="url(#sun-gradient)"/>' },
    mountain: { name: "Уул", depth: 5, view: "0 103 640 252", shape: '<path d="M-25 294 118 144 231 236 354 103 528 241 594 179 667 256v122H-25Z" fill="#795ca9"/><path d="m289 173 65-70 79 71-37-12-16 12-27-20-22 16-16-10Z" fill="#f4e7fa"/><path d="m85 180 33-36 46 37-21-7-15 13Z" fill="#e5ccf5"/><path d="M-25 303q123-73 255-5 125-62 254-8 98-46 183-10v100H-25Z" fill="#468c75"/><path d="M-22 343q132-51 264-16t185-6 241 9v49H-22Z" fill="#2e6c64"/>' },
    cloud: { name: "Үүл", depth: 7, view: "244 98 250 116", shape: '<path d="M250 182q-3-30 40-34 6-36 47-42 45-9 67 29 42-10 57 21 39 1 26 33-7 19-30 19H276q-25 0-26-26Z" fill="#faf1ff"/><path d="M278 204h166" stroke="#e9d8f8" stroke-width="5" stroke-linecap="round"/>' },
    ghost: { name: "Сүнс", depth: 10, view: "433 136 127 145", shape: '<path d="M441 256v-59q0-56 54-56t54 56v60q-8 20-22 5-17 16-32 0-16 16-32 0-16 15-22-6Z" fill="#fff2ff" stroke="#d69aeb" stroke-width="4"/><ellipse cx="479" cy="199" rx="5" ry="8" fill="#5f407e"/><ellipse cx="510" cy="199" rx="5" ry="8" fill="#5f407e"/><path d="M488 217q7 7 14 0" fill="none" stroke="#5f407e" stroke-linecap="round" stroke-width="3"/>' },
    hero: { name: "Баатар", depth: 9, view: "97 171 166 167", shape: '<ellipse cx="177" cy="323" rx="75" ry="13" fill="#1f4d56" opacity=".6"/><path d="m191 238 61 74-76-13-58 12 27-74Z" fill="#c66eae"/><path d="M143 288h63l11 23q4 12-10 12h-22l-9-11-11 11h-22q-13 0-8-13Z" fill="#332449"/><rect x="135" y="222" width="82" height="80" rx="29" fill="#ffd590"/><path d="M125 219q0-44 51-44 54 0 54 45l-14 20h-78Z" fill="#7649a5"/><rect x="136" y="211" width="81" height="37" rx="16" fill="#bbf4d7"/><circle cx="160" cy="229" r="5" fill="#322144"/><circle cx="193" cy="229" r="5" fill="#322144"/><path d="M169 236q7 7 14 0" fill="none" stroke="#322144" stroke-linecap="round" stroke-width="3"/><path d="m176 258 4 9 10 1-8 7 2 10-8-5-8 5 2-10-8-7 10-1Z" fill="#9c5fba"/>' }
  };

  const $ = id => document.getElementById(id);
  const svg = name => document.createElementNS("http://www.w3.org/2000/svg", name);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const phoneLayout = matchMedia("(max-width: 730px)");
  const initialOrder = ["sky", "mountain", "sun", "hero"];
  const nodes = new Map();
  let step, order, unlocked, hidden, opacity, solved, attempts, xp, streak, best, first, session = 0;
  let drag, audio, sound = true, frame = 0;

  for (const [id, layer] of Object.entries(art)) {
    const group = svg("g");
    const shape = svg("g");
    shape.innerHTML = layer.shape;
    group.append(shape);
    nodes.set(id, group);
  }

  // Тайзны жагсаалт ар талаас урд тал руу, самбарын мөрүүд эсрэг чиглэлтэй.
  function visibleRows() {
    const type = tasks[step]?.type;
    const preview = type === "order" ? ["sun", "mountain", "hero"] : type === "eye" ? ["sun"] : [];
    return [
      ...order.filter(id => unlocked.has(id) || preview.includes(id)),
      ...(type === "eye" || hidden.has("cloud") ? ["cloud"] : []),
      ...(type === "opacity" || unlocked.has("hero") ? ["ghost"] : [])
    ];
  }

  function renderScene() {
    const rows = visibleRows();
    $("empty").hidden = rows.length > 0;
    $("art-layers").replaceChildren(...rows.map(id => nodes.get(id)));
    for (const id of rows) {
      const node = nodes.get(id);
      const heroPreview = id === "hero" && !unlocked.has(id);
      node.setAttribute("visibility", hidden.has(id) ? "hidden" : "visible");
      node.setAttribute("opacity", id === "ghost" ? opacity / 100 : heroPreview ? .32 : 1);
    }
  }

  function eyeMarkup(off) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3-6 10-6 10 6 10 6-3 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/>' + (off ? '<path d="m4 4 16 16"/>' : "") + '</svg>';
  }

  function renderPanel(focusSelector) {
    const type = tasks[step]?.type;
    $("rows").replaceChildren(...visibleRows().reverse().map(id => {
      const row = document.createElement("li");
      row.className = "row";
      row.dataset.layer = id;
      const off = hidden.has(id);
      row.classList.toggle("off", off);

      const eye = document.createElement("button");
      eye.type = "button";
      eye.className = "eye";
      eye.disabled = type !== "eye" || solved;
      eye.setAttribute("aria-label", art[id].name + (off ? " харуулах" : " нуух"));
      eye.innerHTML = eyeMarkup(off);
      eye.addEventListener("click", () => toggleEye(id));

      const thumb = svg("svg");
      thumb.setAttribute("class", "thumb");
      thumb.setAttribute("viewBox", art[id].view);
      thumb.setAttribute("aria-hidden", "true");
      thumb.innerHTML = art[id].shape;
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = art[id].name;
      row.append(eye, thumb, name);
      if (type === "order" && id === "sun" && !solved) {
        const handle = document.createElement("button");
        handle.type = "button";
        handle.className = "handle";
        handle.textContent = "⠿";
        handle.setAttribute("aria-label", "Нарны мөрийг чирэх. Дээш, доош сум ашиглаж болно.");
        handle.addEventListener("pointerdown", startDrag);
        handle.addEventListener("pointermove", moveDrag);
        handle.addEventListener("pointerup", endDrag);
        handle.addEventListener("pointercancel", clearDrag);
        handle.addEventListener("lostpointercapture", clearDrag);
        handle.addEventListener("keydown", event => {
          if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
          event.preventDefault();
          moveSun(event.key === "ArrowUp" ? 1 : -1, ".handle");
        });
        row.append(handle);
      }
      return row;
    }));
    $("order-buttons").hidden = type !== "order" || solved;
    $("up").disabled = order.indexOf("sun") >= 2;
    $("down").disabled = order.indexOf("sun") <= 1;
    if (focusSelector) $("rows").querySelector(focusSelector)?.focus();
  }

  function toggleEye(id) {
    if (solved || tasks[step]?.type !== "eye") return;
    if (id === tasks[step].target) {
      hidden = new Set([id]);
      succeed();
      return;
    }
    if (hidden.has(id)) hidden.delete(id);
    else hidden.add(id);
    renderScene();
    renderPanel('[data-layer="' + id + '"] .eye');
    fail("Үүлний мөрийг олоод нүдний дүрсийг дараарай.");
  }

  function moveSun(direction, focusSelector) {
    if (solved || tasks[step]?.type !== "order") return;
    const from = order.indexOf("sun");
    const to = Math.min(2, Math.max(1, from + direction));
    if (from === to) return;
    order.splice(to, 0, order.splice(from, 1)[0]);
    renderScene();
    renderPanel(focusSelector);
    $("hint").textContent = "Нарны байрлал солигдлоо. Тайзан дээрх зургийг ажиглаад шалгаарай.";
  }

  // Нэг ижил чирэх үйлдэл хулгана, мэдрэгчтэй дэлгэц, үзэгт ажиллана.
  function startDrag(event) {
    if (event.button !== 0 || drag) return;
    const handle = event.currentTarget;
    drag = { id: event.pointerId, row: handle.closest(".row"), y: event.clientY, target: null };
    handle.setPointerCapture(event.pointerId);
    drag.row.classList.add("moving");
  }
  function moveDrag(event) {
    if (!drag || drag.id !== event.pointerId) return;
    const row = document.elementFromPoint(event.clientX, event.clientY)?.closest(".row");
    const target = row && row !== drag.row ? row : null;
    if (target === drag.target) return;
    drag.target?.classList.remove("drop");
    drag.target = target;
    target?.classList.add("drop");
  }
  function clearDrag() {
    if (!drag) return;
    drag.row.classList.remove("moving");
    drag.target?.classList.remove("drop");
    drag = null;
  }
  function endDrag(event) {
    if (!drag || drag.id !== event.pointerId) return;
    moveDrag(event);
    const hasTarget = Boolean(drag.target);
    const distance = event.clientY - drag.y;
    clearDrag();
    if (hasTarget && Math.abs(distance) > 4) moveSun(distance > 0 ? -1 : 1, ".handle");
  }

  $("up").addEventListener("click", () => moveSun(1, ".handle"));
  $("down").addEventListener("click", () => moveSun(-1, ".handle"));
  $("opacity").addEventListener("input", event => {
    opacity = Number(event.target.value);
    $("opacity-value").value = opacity + "%";
    nodes.get("ghost").setAttribute("opacity", opacity / 100);
  });
  function animate(element, name) {
    element.classList.remove(name);
    void element.getBoundingClientRect();
    element.classList.add(name);
  }

  // Зөв хариултыг хоёр богино нотоор тэмдэглэнэ.
  function ding() {
    if (!sound) return;
    const Engine = window.AudioContext || window.webkitAudioContext;
    if (!Engine) return;
    try {
      audio ??= new Engine();
      if (audio.state === "suspended") audio.resume().catch(() => {});
      [659, 880].forEach((frequency, index) => {
        const note = audio.createOscillator();
        const gain = audio.createGain();
        const start = audio.currentTime + index * .085;
        note.frequency.value = frequency;
        gain.gain.setValueAtTime(.001, start);
        gain.gain.exponentialRampToValueAtTime(.13, start + .025);
        gain.gain.exponentialRampToValueAtTime(.001, start + .23);
        note.connect(gain).connect(audio.destination);
        note.start(start);
        note.stop(start + .24);
      });
    } catch {
      // Дуу боломжгүй үед даалгавар үргэлжилнэ.
    }
  }

  $("sound").addEventListener("click", () => {
    sound = !sound;
    $("sound").setAttribute("aria-pressed", String(sound));
    $("sound").textContent = sound ? "🔊 Дуу" : "🔇 Дуу";
    if (!sound && audio?.state === "running") audio.suspend().catch(() => {});
  });

  function updateStats() {
    $("xp").textContent = xp + " туршлагын оноо";
    $("streak").textContent = "🔥 Дараалал: " + streak;
  }
  function fail(message) {
    attempts += 1;
    streak = 0;
    updateStats();
    $("hint").textContent = message;
    animate($("task"), "shake");
    animate($("mascot"), "shake");
  }
  function succeed() {
    if (solved) return;
    solved = true;
    const task = tasks[step];
    const earned = attempts === 0 ? 100 : 60;
    if (attempts === 0) {
      first += 1;
      streak += 1;
      best = Math.max(streak, best);
    }
    xp += earned;
    unlocked.add(task.reward);
    renderScene();
    renderPanel();
    updateStats();
    animate(nodes.get(task.reward).firstElementChild, "stage-enter");
    $("hint").textContent = "Боллоо! " + art[task.reward].name + " давхарга нээгдлээ. +" + earned + " оноо";
    $("why").textContent = "Яагаад? " + task.why;
    $("why").hidden = false;
    $("check").hidden = true;
    $("opacity").disabled = true;
    $("next").disabled = false;
    $("next").focus({ preventScroll: true });
    animate($("task"), "glow");
    animate($("mascot"), "jump");
    ding();
  }

  $("check").addEventListener("click", () => {
    const task = tasks[step];
    if (solved || !task) return;
    const correct = task.type === "order"
      ? task.expected.every((id, index) => order[index] === id)
      : opacity >= task.min && opacity <= task.max;
    if (correct) succeed();
    else fail(task.hint);
  });

  function renderTask(focus = true) {
    const task = tasks[step];
    solved = false;
    attempts = 0;
    $("progress-label").textContent = "Даалгавар " + (step + 1) + " / " + tasks.length;
    $("progress").max = tasks.length;
    $("progress").value = step + 1;
    $("title").textContent = task.title;
    $("instruction").textContent = task.instruction;
    $("hint").textContent = task.hint;
    $("why").hidden = true;
    $("next").disabled = true;
    $("next").textContent = step === tasks.length - 1 ? "Дүн харах →" : "Дараах даалгавар →";
    $("check").hidden = task.type !== "order" && task.type !== "opacity";
    $("range").hidden = task.type !== "opacity";
    $("opacity").disabled = false;
    $("choices").hidden = task.type !== "choice";
    $("choices").replaceChildren(...(task.choices ?? []).map((label, index) => {
      const choice = document.createElement("button");
      choice.type = "button";
      choice.textContent = "АБВГ"[index] + ". " + label;
      choice.addEventListener("click", () => {
        if (solved) return;
        if (index === task.correct) {
          choice.classList.add("right");
          for (const button of $("choices").children) button.disabled = true;
          succeed();
        } else {
          choice.classList.add("wrong");
          choice.disabled = true;
          fail(task.hint);
        }
      });
      return choice;
    }));
    $("task").classList.remove("shake", "glow");
    animate($("task"), "task-enter");
    renderScene();
    renderPanel();
    if (focus) {
      $("title").focus({ preventScroll: true });
      if (phoneLayout.matches) $("task-intro").scrollIntoView({ block: "start" });
    }
  }

  // Хулгана эсвэл утас хазайхад урд давхаргууд илүү хол шилжинэ.
  const clamp = value => Math.max(-1, Math.min(1, value));
  function parallax(x, y) {
    if (reduce.matches) return;
    for (const [id, node] of nodes) {
      node.setAttribute("transform", "translate(" + x * art[id].depth + " " + y * art[id].depth + ")");
    }
  }
  $("scene").addEventListener("pointermove", event => {
    if (event.pointerType !== "mouse") return;
    const bounds = $("scene").getBoundingClientRect();
    parallax(clamp((event.clientX - bounds.left) / bounds.width * 2 - 1),
      clamp((event.clientY - bounds.top) / bounds.height * 2 - 1));
  });
  $("scene").addEventListener("pointerleave", () => parallax(0, 0));

  const orientation = window.DeviceOrientationEvent;
  function tilt(event) {
    if (!Number.isFinite(event.gamma) || !Number.isFinite(event.beta)) return;
    parallax(clamp(event.gamma / 30), clamp((event.beta - 45) / 35));
  }
  if (typeof orientation?.requestPermission === "function") {
    $("tilt").hidden = reduce.matches;
    $("tilt").addEventListener("click", async () => {
      try {
        if (await orientation.requestPermission() === "granted") {
          window.addEventListener("deviceorientation", tilt);
          $("tilt").hidden = true;
          return;
        }
      } catch {
        // Хөтөч мэдрэгч ашиглуулахгүй байж болно.
      }
      $("tilt").textContent = "Хөдөлгөөн ашиглах боломжгүй";
      $("tilt").disabled = true;
    });
  } else if (orientation) window.addEventListener("deviceorientation", tilt);

  const canvas = $("confetti");
  function stopConfetti() {
    cancelAnimationFrame(frame);
    canvas.hidden = true;
  }
  function celebrate() {
    if (reduce.matches) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    canvas.hidden = false;
    const colors = ["#df78bd", "#a273d9", "#7ed7b4", "#ffc87e"];
    const pieces = Array.from({ length: 75 }, (_, index) => ({
      x: Math.random() * canvas.width,
      y: -Math.random() * 235,
      speed: 120 + Math.random() * (canvas.height * .64 + 60),
      color: colors[index % colors.length]
    }));
    const start = performance.now();
    function draw(now) {
      const elapsed = (now - start) / 1000;
      if (elapsed >= 2.1) return stopConfetti();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const piece of pieces) {
        ctx.save();
        ctx.translate(piece.x + Math.sin(elapsed * 4 + piece.x) * 17, piece.y + elapsed * piece.speed);
        ctx.rotate(elapsed * 3 + piece.x);
        ctx.fillStyle = piece.color;
        ctx.fillRect(0, 0, 8, 5);
        ctx.restore();
      }
      frame = requestAnimationFrame(draw);
    }
    frame = requestAnimationFrame(draw);
  }

  reduce.addEventListener("change", event => {
    if (!event.matches) return;
    stopConfetti();
    nodes.forEach(node => node.removeAttribute("transform"));
  });

  function showResult() {
    step = tasks.length;
    $("task-intro").hidden = true;
    $("task").hidden = true;
    $("result").hidden = false;
    $("progress-label").textContent = "Зураг бэлэн!";
    const stars = first === tasks.length ? 3 : first >= tasks.length / 2 ? 2 : 1;
    $("stars").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    $("stars").setAttribute("aria-label", "Гурван одноос " + stars + " од");
    $("award").textContent = ["Давхаргын дадлагажигч", "Зургийн бүтээгч", "Давхаргын мастер"][stars - 1];
    $("summary").textContent = "Эхний оролдлогоор зөв: " + first + " / " + tasks.length
      + " · " + xp + " туршлагын оноо · 🔥 Хамгийн урт дараалал: " + best;
    renderScene();
    renderPanel();
    $("award").focus();
    celebrate();
  }
  $("next").addEventListener("click", () => {
    if (!solved || step >= tasks.length) return;
    if (step === tasks.length - 1) showResult();
    else {
      step += 1;
      renderTask();
    }
  });

  // Эцсийн тайзыг хөдөлгөөний шилжилтгүйгээр хоёр дахин том PNG болгоно.
  $("save").addEventListener("click", async () => {
    const current = session;
    const button = $("save");
    button.disabled = true;
    let sourceUrl;
    try {
      const artwork = $("artwork").cloneNode(true);
      artwork.setAttribute("width", "640");
      artwork.setAttribute("height", "355");
      artwork.querySelectorAll("#art-layers > g").forEach(layer => layer.removeAttribute("transform"));
      const source = new XMLSerializer().serializeToString(artwork);
      sourceUrl = URL.createObjectURL(new Blob([source], { type: "image/svg+xml;charset=utf-8" }));
      const image = new Image();
      image.src = sourceUrl;
      await image.decode();
      if (current !== session) return;

      const output = document.createElement("canvas");
      output.width = 1280;
      output.height = 710;
      output.getContext("2d").drawImage(image, 0, 0, output.width, output.height);
      const png = await new Promise(resolve => output.toBlob(resolve, "image/png"));
      if (current !== session) return;
      if (!png) throw new Error("Зураг хөрвөсөнгүй");

      const pngUrl = URL.createObjectURL(png);
      const link = document.createElement("a");
      link.href = pngUrl;
      link.download = "Миний-давхаргат-зураг.png";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(pngUrl), 10000);
      $("save-status").textContent = "Зургийг татаж эхэллээ.";
    } catch {
      if (current === session) $("save-status").textContent = "Зургийг хадгалж чадсангүй. Дахин оролдоорой.";
    } finally {
      if (sourceUrl) URL.revokeObjectURL(sourceUrl);
      if (current === session) button.disabled = false;
    }
  });

  function reset(focus = true) {
    session += 1;
    stopConfetti();
    clearDrag();
    step = attempts = xp = streak = best = first = 0;
    order = [...initialOrder];
    unlocked = new Set();
    hidden = new Set();
    opacity = 100;
    $("opacity").value = "100";
    $("opacity-value").value = "100%";
    $("save").disabled = false;
    $("save-status").textContent = "";
    $("task-intro").hidden = false;
    $("task").hidden = false;
    $("result").hidden = true;
    nodes.forEach(node => {
      node.removeAttribute("transform");
      node.firstElementChild.classList.remove("stage-enter");
    });
    updateStats();
    renderTask(focus);
  }
  $("restart").addEventListener("click", () => reset());
  reset(false);
</script>
<script>
  // Дүрслэлийн давхарга нь тоглоомын гаргасан төлөвийг уншиж, зөвхөн харагдацыг шинэчилнэ.
  (() => {
    const get = id => document.getElementById(id);
    const watch = (node, callback, options) => {
      new MutationObserver(callback).observe(node, options);
    };
    const replay = (node, className) => {
      node.classList.remove(className);
      void node.offsetWidth;
      node.classList.add(className);
    };

    const progress = get("progress");
    const steps = get("steps");
    const explanation = get("why");
    const result = get("result");
    function paintSteps() {
      const current = progress.value;
      const count = progress.max;
      const solved = !explanation.hidden;
      const finished = !result.hidden;
      steps.replaceChildren(...Array.from({ length: count }, (_, index) => {
        const number = index + 1;
        const done = finished || number < current || (number === current && solved);
        const dot = document.createElement("li");
        dot.className = done ? "done" : number === current ? "current" : "";
        dot.textContent = done ? "✓" : String(number);
        return dot;
      }));
      progress.parentElement.style.setProperty("--fill", (current / count * 100) + "%");
    }
    paintSteps();
    watch(progress, paintSteps, { attributeFilter: ["value", "max"] });
    watch(result, paintSteps, { attributeFilter: ["hidden"] });
    watch(explanation, () => {
      paintSteps();
      if (!explanation.hidden) replay(get("scene"), "reward");
    }, { attributeFilter: ["hidden"] });

    function dressCounter(id, read, format) {
      const counter = get(id);
      let previous;
      function paint() {
        const value = counter.textContent.match(read)?.[1];
        if (value === undefined) return;
        counter.textContent = format(value);
        if (previous !== undefined && previous !== value) replay(counter, "pop");
        previous = value;
      }
      paint();
      watch(counter, paint, { childList: true });
    }
    dressCounter("xp", /^(\d+) туршлагын оноо$/, value => "⭐ " + value + " XP");
    dressCounter("streak", /^🔥 Дараалал: (\d+)$/, value => "🔥 " + value);

    const choices = get("choices");
    function dressChoices() {
      for (const button of choices.children) {
        if (button.firstElementChild) continue;
        const [letter, ...label] = button.textContent.split(". ");
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = letter;
        const text = document.createElement("span");
        text.textContent = label.join(". ");
        button.replaceChildren(badge, text);
      }
    }
    dressChoices();
    watch(choices, dressChoices, { childList: true });

    const rows = get("rows");
    let knownRows = new Set();
    let selected;
    function paintRows() {
      const nextRows = new Set();
      for (const row of rows.children) {
        const key = row.dataset.layer;
        nextRows.add(key);
        row.classList.toggle("selected", key === selected);
        if (!knownRows.has(key)) row.classList.add("fresh");
      }
      knownRows = nextRows;
      if (!knownRows.has(selected)) selected = undefined;
    }
    function selectRow(event) {
      const row = event.target.closest(".row");
      if (!row) return;
      selected = row.dataset.layer;
      for (const item of rows.children) item.classList.toggle("selected", item === row);
    }
    rows.addEventListener("pointerdown", selectRow);
    rows.addEventListener("focusin", selectRow);
    paintRows();
    watch(rows, paintRows, { childList: true });
  })();
</script>
</body>
</html>
